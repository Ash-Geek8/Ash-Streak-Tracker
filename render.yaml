services:
  - type: web
    name: ash-streak
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ash-streak-db
          property: connectionString
databases:
  - name: ash-streak-db
    plan: free
